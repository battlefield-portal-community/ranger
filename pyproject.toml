[project]
name = "ranger"
version = "0.1.0"
description = "General Purpose  bot for BFPC"
authors = [
    { name = "MagneticNeedle", email = "solankivibhakar82@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "discord-py>=2.7.1",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.5.0",
]

[project.scripts]
app = "app.__main__:start"

[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "src"

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
# Ruff defaults (E4, E7, E9, F) plus explicit unused-variable/import enforcement.
select = ["E4", "E7", "E9", "F", "W"]
# Only a bare underscore is an acceptable throwaway name; `_foo` still errors.
dummy-variable-rgx = "^_$"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "ruff>=0.16.0",
]
