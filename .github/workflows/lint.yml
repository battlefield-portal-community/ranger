name: Lint

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: lint-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Run ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: uv.lock  # same ruff version as the pre-commit hook
          args: check --output-format=github
